<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汪汪隊立大功</title>
<style>
  /* ===== 字型 ===== */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  /* ===== 主題變數：溫暖懷舊復古 ===== */
  :root {
    --paper:        #f4ead5;
    --paper-2:      #ede0c4;
    --paper-3:      #e3d3b1;
    --ink:          #3a2817;
    --ink-soft:     #5a4530;
    --accent:       #a4651a;
    --accent-deep:  #7a4715;
    --accent-glow:  #c8893f;
    --crimson:      #9b3a2f;
    --moss:         #6b7a3f;
    --bamboo:       #4a5d3a;
    --shadow-sm:    0 2px 6px rgba(58, 40, 23, .15);
    --shadow-md:    0 6px 20px rgba(58, 40, 23, .25);
    --shadow-lg:    0 14px 40px rgba(58, 40, 23, .35);
    --serif:        'Noto Serif TC', 'cwTeXKai', serif;
    --sans:         'Noto Sans TC', sans-serif;
    --brush:        'Noto Serif TC', serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top, rgba(200,137,63,.08), transparent 60%),
      radial-gradient(ellipse at bottom, rgba(122,71,21,.10), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .23 0 0 0 0 .16 0 0 0 0 .09 0 0 0 .08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    line-height: 1.85;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== 頂部導覽列 ===== */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: linear-gradient(to bottom, rgba(244,234,213,.97), rgba(244,234,213,.92));
    border-bottom: 1px solid var(--paper-3);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(58,40,23,.06);
  }
  #title-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  #title-block .logo {
    font-family: var(--brush);
    font-size: 28px;
    color: var(--accent-deep);
    letter-spacing: 4px;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #title-block .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 3px;
  }
  #topbar .nav-tools {
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    background: var(--paper-2);
    border: 1px solid var(--paper-3);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .2s ease;
    box-shadow: var(--shadow-sm);
  }
  .icon-btn:hover {
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .icon-btn:active { transform: translateY(0); }

  /* ===== 主舞台 ===== */
  #stage {
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 28px 80px;
    position: relative;
  }

  #scene-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1s ease;
    filter: saturate(.85) brightness(.85);
  }
  #scene-bg.show { opacity: .35; }
  #scene-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(244,234,213,.55), rgba(244,234,213,.85));
  }

  /* ===== 段落卡 ===== */
  #passage {
    background: var(--paper);
    border: 1px solid var(--paper-3);
    border-radius: 4px;
    padding: 50px 56px;
    position: relative;
    box-shadow:
      var(--shadow-md),
      inset 0 0 80px rgba(122,71,21,.04);
    min-height: 320px;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .14 0 0 0 .04 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #passage::before, #passage::after {
    content: '';
    position: absolute;
    width: 32px;
    height: 32px;
    border: 2px solid var(--accent-deep);
    pointer-events: none;
  }
  #passage::before {
    top: 12px; left: 12px;
    border-right: none; border-bottom: none;
  }
  #passage::after {
    bottom: 12px; right: 12px;
    border-left: none; border-top: none;
  }

  .passage-content {
    font-size: 17px;
    color: var(--ink);
  }
  .passage-content.fade-in {
    animation: fadeUp .7s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .passage-content p { margin: 0 0 1.2em; }
  .passage-content h1, .passage-content h2, .passage-content h3 {
    font-family: var(--brush);
    color: var(--accent-deep);
    letter-spacing: 4px;
    margin: 0 0 0.8em;
    font-weight: 400;
  }
  .passage-content h1 { font-size: 36px; }
  .passage-content h2 { font-size: 28px; }
  .passage-content h3 { font-size: 22px; }
  .passage-content img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 18px auto;
    border-radius: 3px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--paper-3);
  }
  .passage-content .center { text-align: center; display: block; }
  .passage-content .rumble {
    display: inline-block;
    animation: rumble .25s linear infinite;
    color: var(--crimson);
    font-weight: 700;
    font-size: 1.15em;
  }
  @keyframes rumble {
    0%, 100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-1px, 1px) rotate(-.5deg); }
    50% { transform: translate(1px, -1px) rotate(.5deg); }
    75% { transform: translate(-1px, -1px) rotate(.3deg); }
  }
  .passage-content .smear {
    color: var(--crimson);
    font-weight: 700;
    text-shadow:
      0 0 12px rgba(155,58,47,.5),
      0 0 24px rgba(155,58,47,.3);
    letter-spacing: 2px;
  }
  .passage-content table {
    margin: 16px auto;
    border-collapse: collapse;
  }
  .passage-content table td {
    padding: 6px;
    text-align: center;
  }
  .passage-content table[border] td {
    border: 1.5px solid var(--ink-soft);
    background: var(--paper-2);
    min-width: 44px;
    padding: 10px;
    font-weight: 700;
    font-size: 18px;
  }
  /* 處理原始 <tr><td>...</td></tr> 直接寫在文字裡的情況 */
  .img-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin: 20px 0;
  }
  .img-row img { margin: 0; max-width: 100%; }

  /* 對白色彩（保留原有@@color指定） */
  .speak-aliceblue { color: #4a6b8a; font-weight: 500; }
  .speak-cornsilk  { color: #8a6d3b; font-weight: 500; }
  .speak-darkseagreen { color: var(--bamboo); font-weight: 700; letter-spacing: 1px; }
  .speak-chocolate { color: var(--accent-deep); font-weight: 700; letter-spacing: 2px; }

  /* ===== 連結（劇情選項） ===== */
  .choices {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choice-link {
    display: inline-block;
    background: linear-gradient(to bottom, var(--paper-2), var(--paper-3));
    border: 1px solid var(--accent);
    color: var(--accent-deep);
    padding: 14px 22px;
    border-radius: 6px;
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    text-align: center;
    transition: all .25s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 1px;
  }
  .choice-link:hover {
    background: linear-gradient(to bottom, var(--accent), var(--accent-deep));
    color: var(--paper);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .choice-link::before {
    content: '❯';
    margin-right: 10px;
    color: var(--accent);
    transition: color .25s;
  }
  .choice-link:hover::before { color: var(--paper); }

  /* 行內連結（如「回[[主地圖]]」） */
  a.inline-link {
    color: var(--accent-deep);
    text-decoration: none;
    border-bottom: 1.5px dashed var(--accent);
    padding: 0 2px;
    cursor: pointer;
    font-weight: 500;
    transition: all .2s;
  }
  a.inline-link:hover {
    background: var(--accent);
    color: var(--paper);
    border-bottom-color: var(--accent);
  }

  /* ===== 互動地圖 ===== */
  .map-wrapper {
    position: relative;
    display: inline-block;
    max-width: 100%;
    margin: 16px auto;
  }
  .map-wrapper img { display: block; max-width: 100%; height: auto; margin: 0; }
  .hot-area {
    position: absolute;
    cursor: pointer;
    background: rgba(164,101,26,.0);
    border: 2px dashed transparent;
    border-radius: 6px;
    transition: all .25s ease;
  }
  .hot-area:hover {
    background: rgba(164,101,26,.25);
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(200,137,63,.6);
  }
  .hot-area.circle { border-radius: 50%; }
  .hot-area .label {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .hot-area:hover .label { opacity: 1; }

  .pulse-dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 0 rgba(164,101,26,.7);
    animation: pulse 2s infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(164,101,26,.7); }
    70%  { box-shadow: 0 0 0 16px rgba(164,101,26,0); }
    100% { box-shadow: 0 0 0 0 rgba(164,101,26,0); }
  }

  /* ===== 視覺小說對話 ===== */
  .vn-scene {
    position: relative;
    margin: 12px 0;
  }
  .vn-character {
    text-align: center;
    margin-bottom: 18px;
  }
  .vn-character img {
    max-height: 360px;
    width: auto;
    margin: 0 auto;
    box-shadow: none;
    border: none;
    background: transparent;
    filter: drop-shadow(0 8px 24px rgba(58,40,23,.3));
  }
  .vn-box {
    background: linear-gradient(to bottom, rgba(244,234,213,.98), rgba(237,224,196,.98));
    border: 2px solid var(--accent-deep);
    border-radius: 8px;
    padding: 22px 28px 26px;
    margin: 18px auto 0;
    max-width: 720px;
    position: relative;
    box-shadow: var(--shadow-md);
  }
  .vn-name {
    display: inline-block;
    background: var(--accent-deep);
    color: var(--paper);
    padding: 4px 18px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    position: absolute;
    top: -18px;
    left: 24px;
  }
  .vn-text {
    font-size: 16px;
    line-height: 1.9;
    min-height: 60px;
    margin-top: 8px;
  }
  .vn-next {
    text-align: right;
    margin-top: 12px;
    color: var(--accent);
    font-size: 14px;
    animation: blink 1.4s infinite;
    cursor: pointer;
    user-select: none;
  }
  @keyframes blink {
    0%, 100% { opacity: .4; }
    50% { opacity: 1; }
  }

  /* ===== 密碼輸入 ===== */
  .code-form {
    background: var(--paper-2);
    border: 1.5px solid var(--paper-3);
    border-radius: 8px;
    padding: 22px 24px;
    margin: 20px auto;
    max-width: 480px;
    box-shadow: var(--shadow-sm);
  }
  .code-form input {
    width: 100%;
    padding: 12px 14px;
    font-size: 17px;
    font-family: var(--serif);
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 12px;
    letter-spacing: 4px;
    text-align: center;
  }
  .code-form input:focus {
    outline: none;
    border-color: var(--accent-deep);
    box-shadow: 0 0 0 3px rgba(164,101,26,.18);
  }
  .code-form button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-family: var(--serif);
    background: linear-gradient(to bottom, var(--accent), var(--accent-deep));
    color: var(--paper);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 4px;
    transition: all .2s;
  }
  .code-form button:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .code-error {
    color: var(--crimson);
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    min-height: 20px;
  }
  .shake-x { animation: shakeX .4s; }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ===== 線索背包抽屜 ===== */
  #inv-toggle {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 60;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(to bottom, var(--accent), var(--accent-deep));
    color: var(--paper);
    border: 2px solid var(--paper);
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s;
  }
  #inv-toggle:hover { transform: scale(1.08) rotate(-6deg); }
  #inv-toggle .badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--crimson);
    color: var(--paper);
    border: 2px solid var(--paper);
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 999px;
    min-width: 22px;
    font-family: var(--sans);
    font-weight: 700;
  }

  #inv-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 420px;
    max-width: 92vw;
    height: 100%;
    background: var(--paper);
    z-index: 70;
    transform: translateX(105%);
    transition: transform .35s cubic-bezier(.4,.0,.2,1);
    box-shadow: var(--shadow-lg);
    display: flex;
    flex-direction: column;
    border-left: 3px double var(--accent-deep);
  }
  #inv-drawer.open { transform: translateX(0); }
  #inv-header {
    padding: 22px 26px 16px;
    border-bottom: 1px solid var(--paper-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper-2);
  }
  #inv-header h2 {
    font-family: var(--brush);
    color: var(--accent-deep);
    margin: 0;
    font-size: 26px;
    letter-spacing: 4px;
    font-weight: 400;
  }
  #inv-close {
    background: transparent;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--ink-soft);
    line-height: 1;
    padding: 4px 8px;
  }
  #inv-close:hover { color: var(--crimson); }
  #inv-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 40px;
  }
  .clue-group {
    margin-bottom: 22px;
  }
  .clue-group-title {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--accent-deep);
    font-size: 16px;
    padding: 8px 0;
    border-bottom: 1.5px solid var(--paper-3);
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .clue-item {
    background: var(--paper-2);
    border: 1px solid var(--paper-3);
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.7;
    border-radius: 3px;
    animation: slideIn .4s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .clue-empty {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 13px;
    padding: 8px 0;
    text-align: center;
    opacity: .7;
  }
  .clue-name {
    color: var(--crimson);
    font-weight: 700;
    margin-bottom: 4px;
    display: block;
  }
  .clue-item table {
    margin: 6px auto;
    border-collapse: collapse;
  }
  .clue-item table td {
    border: 1px solid var(--ink-soft);
    padding: 4px 10px;
    background: var(--paper);
  }

  /* ===== 對話框（dialog） ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(58,40,23,.55);
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    animation: fadeIn .25s;
  }
  .modal-mask.show { display: flex; }
  @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
  .modal-box {
    background: var(--paper);
    padding: 32px 36px;
    border-radius: 6px;
    border: 2px solid var(--accent-deep);
    max-width: 520px;
    width: 90%;
    box-shadow: var(--shadow-lg);
    position: relative;
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box h3 {
    font-family: var(--brush);
    color: var(--accent-deep);
    margin: 0 0 14px;
    font-size: 24px;
    letter-spacing: 3px;
    font-weight: 400;
    border-bottom: 1px dashed var(--paper-3);
    padding-bottom: 10px;
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 14px;
    background: transparent;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .modal-close:hover { color: var(--crimson); }

  /* ===== 答題環節 ===== */
  .qa-block {
    background: var(--paper-2);
    border: 1px solid var(--paper-3);
    padding: 18px 22px;
    border-radius: 6px;
    margin: 16px 0;
  }
  .qa-block label {
    display: block;
    font-weight: 700;
    color: var(--accent-deep);
    margin-bottom: 8px;
    font-size: 15px;
  }
  .qa-block select {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    font-family: var(--serif);
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .qa-block select:focus {
    outline: none;
    border-color: var(--accent-deep);
    box-shadow: 0 0 0 3px rgba(164,101,26,.18);
  }

  /* ===== 線索組合表 ===== */
  .combine-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 10px;
    margin: 16px 0;
  }
  .combine-table td {
    padding: 8px 12px;
    background: var(--paper-2);
    border: 1px solid var(--paper-3);
  }
  .combine-table td:first-child {
    border-radius: 4px 0 0 4px;
    width: 240px;
  }
  .combine-table td:last-child {
    border-radius: 0 4px 4px 0;
  }
  .combine-table select {
    padding: 8px 10px;
    font-size: 15px;
    font-family: var(--serif);
    border: 1.5px solid var(--accent);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    min-width: 180px;
  }
  .combine-preview table {
    margin: 0;
    border-collapse: collapse;
  }
  .combine-preview table td {
    border: 1.5px solid var(--ink-soft);
    background: var(--paper);
    padding: 8px 14px;
    font-weight: 700;
  }
  .combine-empty {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 14px;
  }

  /* ===== 視覺特效 ===== */
  .delayed { opacity: 0; animation: appear .6s forwards; display: block; }
  .delayed-1 { animation-delay: .3s; }

function vnRender(name, lines, choicesAfter) {
  // lines: [text, text, ...]，最後一頁顯示 choicesAfter（HTML 字串）
  const html = `
    <div class="vn-scene">
      <div class="vn-character"><img src="media/會計員.png" alt="會計員"></div>
      <div class="vn-box">
        <span class="vn-name">${name}</span>
        <div class="vn-text" id="vn-text"></div>
        <div class="vn-next" id="vn-next">▼ 點擊繼續</div>
      </div>
    </div>
  `;
  return { html, lines, choicesAfter };
}
function vnAttach(passageName, lines, name, choicesAfter) {
  passages[passageName].after = () => {
    let idx = 0;
    const textEl = document.getElementById('vn-text');
    const nextEl = document.getElementById('vn-next');
    const advance = () => {
      if (idx < lines.length) {
        textEl.style.opacity = 0;
        setTimeout(() => {
          textEl.innerHTML = lines[idx];
          textEl.style.opacity = 1;
          idx++;
          if (idx >= lines.length) {
            nextEl.style.display = 'none';
            const wrap = document.createElement('div');
            wrap.className = 'choices';
            wrap.innerHTML = choicesAfter;
            textEl.parentNode.appendChild(wrap);
            bindChoices(wrap);
          }
        }, 200);
      }
    };
    advance();
    document.querySelector('.vn-box').addEventListener('click', e => {
      if (idx < lines.length) advance();
    });
  };
}

function cluePreviewHTML(name) {
  if (!name || name === '無') return '<span class="combine-empty">~選擇線索~</span>';
  const t = clueTables[name];
  if (!t) return '<span class="combine-empty">~選擇線索~</span>';
  return `<table border="1"><tr>${t[0].map(n => `<td>${n}</td>`).join('')}</tr></table>`;
}

/* 渲染段落 */
function goto(name) {
  const passage = passages[name];
  if (!passage) {
    console.warn('未知段落：', name);
    return;
  }
  // 推入歷史（不返回頁不入歷史）
  if (state.history[state.history.length-1] !== name) {
    state.history.push(name);
    if (state.history.length > 50) state.history.shift();
  }
  // 切背景
  setBg(passage.bg);

  // 渲染
  const node = document.getElementById('passage');
  node.classList.remove('fade-in');
  node.innerHTML = `<div class="passage-content fade-in">${passage.render()}</div>`;
  // 觸發動畫
  void node.offsetWidth;
  node.firstElementChild.classList.add('fade-in');

  // 綁定段落內連結
  bindChoices(node);

  // 自定義初始化
  if (passage.after) passage.after();

  // 部署熱區
  initHotAreas();

  // 更新背包數字
  updateInvBadge();

  // 滾到上方
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function back() {
  // 退回上一個有意義的段落
  if (state.history.length >= 2) {
    state.history.pop(); // 當前
    const prev = state.history.pop();
    goto(prev);
  } else {
    goto('主地圖');
  }
}

function bindChoices(scope) {
  scope.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      goto(el.dataset.goto);
    });
  });
  scope.querySelectorAll('[data-action="back"]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      back();
    });
  });
  scope.querySelectorAll('[data-action="open-inv"]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      hideModal();
      openInventory();
    });
  });
}

/* 場景背景圖：沿用原 tag 對應 media 內的素材 */
function setBg(tag) {
  const el = document.getElementById('scene-bg');
  if (!tag) {
    el.classList.remove('show');
    el.style.backgroundImage = '';
    return;
  }
  // 嘗試 .jpg / .png
  const tryUrls = [`media/${tag}.jpg`, `media/${tag}.png`, `media/${tag}.JPG`, `media/${tag}.PNG`];
  let i = 0;
  const test = () => {
    if (i >= tryUrls.length) {
      el.classList.remove('show');
      return;
    }
    const img = new Image();
    img.onload = () => {
      el.style.backgroundImage = `url("${tryUrls[i]}")`;
      el.classList.add('show');
    };
    img.onerror = () => { i++; test(); };
    img.src = tryUrls[i];
  };
  test();
}

/* 熱區：將原 imageMap 的 coords 換算為相對位置 */
function initHotAreas() {
  document.querySelectorAll('.hot-area').forEach(area => {
    const imgSel = area.dataset.img;
    if (!imgSel) return;
    const img = document.querySelector(imgSel);
    if (!img) return;
    const apply = () => {
      const rect = { w: img.naturalWidth, h: img.naturalHeight };
      if (!rect.w) return;
      const dispW = img.clientWidth;
      const dispH = img.clientHeight;
      const sx = dispW / rect.w;
      const sy = dispH / rect.h;
      const c = area.dataset.coords.split(',').map(Number);
      if (area.dataset.shape === 'rect') {
        const [x1, y1, x2, y2] = c;
        area.style.left   = (x1 * sx) + 'px';
        area.style.top    = (y1 * sy) + 'px';
        area.style.width  = ((x2 - x1) * sx) + 'px';
        area.style.height = ((y2 - y1) * sy) + 'px';
      } else if (area.dataset.shape === 'circle') {
        const [cx, cy, r] = c;
        const rPx = r * Math.min(sx, sy) * 1.4; // 稍微放大方便點
        area.style.left   = (cx * sx - rPx) + 'px';
        area.style.top    = (cy * sy - rPx) + 'px';
        area.style.width  = (rPx * 2) + 'px';
        area.style.height = (rPx * 2) + 'px';
      }
      area.style.display = 'block';
    };
    if (img.complete && img.naturalWidth) {
      apply();
    } else {
      img.addEventListener('load', apply, { once: true });
    }
    // 重設大小重新換算
    let resizeT;
    window.addEventListener('resize', () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(apply, 80);
    });

    // 點擊綁定
    if (!area.__bound) {
      area.__bound = true;
      area.addEventListener('click', () => {
        if (area.dataset.goto) goto(area.dataset.goto);
      });
    }
  });
}

    content: '過去臺灣最主要的兩項農作物是甘蔗與稻米，而其分布大致呈現「南糖北米」的現象。<br>進入日治時期後，由於臺灣原本的在來米因不具黏稠性而不受日本人歡迎，相較於被大力推廣的糖業，最初總督府方面並不鼓勵種植稻米。<br>1922年，蓬萊米培植成功成為台灣外銷米種中口碑甚好的一種，「米糖相剋」問題開始浮現。'
  });
  if (state.dad) sugarItems.push({
    name: '【糖廠員工證】',
    content: '晴子爸爸員工你找到一張糖廠重要幹部的員工證，上面的人叫做山田攸斗，似乎是晴子的爸爸，不過更令你驚訝的是，他竟然是日糖五課中影響力最大的營業課長！'
  });
  if (state.ricesugar) sugarItems.push({
    name: '【米糖相剋】',
    content: '蓬萊米培植成功，「米糖相剋」問題開始浮現。<br>甘蔗的收購價格透過米、蔗田收入的比較，為米農收入所決定。而當米價上揚，農民爭搶種稻米時，甘蔗收購價格也會因米作收入增長而被迫提高，這時糖業苦於蔗農因米作收益提高而頻頻轉作導致的原料供應不足及不穩定。'
  });
  groups.push({ title: '⭐ 糖廠線索', items: sugarItems });

  // 山田家
  const yamadaItems = [];
  if (state.light) yamadaItems.push({
    name: '【燈謎】',
    content: '本島鐵道開通，打四書一句'
  });
  groups.push({ title: '⭐ 山田家線索', items: yamadaItems });

  // 張藍家
  const changItems = [];
  if (state.diarytwo) changItems.push({
    name: '【張藍日記2】',
    content: '『南部的首都台南<br>是島上古色古香的代表<br>因為是開台之地所以人口眾多<br>也有許多的名勝古蹟…』<br>今天學了這首童謠，沒想到我居住的台南居然有這麼多有意義的地方，<br>赤崁樓、開山神社、五妃墓、孔廟......<br>之後有機會一定要去走走啊。'
  });
  if (state.diarytwo) changItems.push({
    name: '【張藍日記3】',
    content: '今天和山田去商店街買零食，看到當時會社為了廣告行銷所做的產品，他們將廣告文宣印在上面，讓小孩可以邊玩、邊看廣告。<br>我玩了幾次竟然抽到大獎！和山田吃吃喝喝滿載而歸，真是幸福啊~'
  });
  groups.push({ title: '⭐ 張藍家線索', items: changItems });

  // 古蹟地圖
  const ruinItems = [];
  if (state.rbuilding) ruinItems.push({
    name: '【赤崁樓】',
    content: '<table border="1"><tr><td>25</td><td>78</td><td>96</td><td>57</td></tr></table>'
  });
  if (state.mbuilding) ruinItems.push({
    name: '【開山神社】',
    content: '<table border="1"><tr><td>94</td><td>05</td><td>19</td><td>25</td></tr></table>'
  });
  if (state.fbuilding) ruinItems.push({
    name: '【五妃墓】',
    content: '<table border="1"><tr><td>04</td><td>65</td><td>10</td><td>25</td></tr></table>'
  });
  if (state.cbuilding) ruinItems.push({
    name: '【孔廟】',
    content: '<table border="1"><tr><td>81</td><td>14</td><td>83</td><td>17</td></tr></table>'
  });
  if (state.rbuilding && state.mbuilding && state.fbuilding && state.cbuilding) {
    ruinItems.push({
      name: '🔍 線索組合',
      content: '<a class="inline-link" data-goto="線索組合">前往線索排列解謎</a>'
    });
  }
  if (state.paper) ruinItems.push({
    name: '【紙條】',
    content: '山田同學真是位善良的朋友，尚記得在河邊遇見她那日，她為我繪製肖像那夕陽絢爛的午後，伴我猜燈謎那晚.......能與一位日本人結下如此般的友誼是我未曾設想的，世界上果然沒有絕對的事，日本人不全然是壞人，而我對山田同學的情感或許也不只是友誼.......但願有一天能親口告訴她。'
  });
  groups.push({ title: '⭐ 古蹟地圖線索', items: ruinItems });

  // 渲染
  body.innerHTML = groups.map(g => `
    <div class="clue-group">
      <div class="clue-group-title">${g.title}</div>
      ${g.items.length === 0
        ? '<div class="clue-empty">尚未發現線索</div>'
        : g.items.map(it => `<div class="clue-item"><span class="clue-name">${it.name}</span>${it.content}</div>`).join('')
      }
    </div>
  `).join('');

  // 綁定
  bindChoices(body);
  body.querySelectorAll('.inline-link[data-goto]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      closeInventory();
      goto(el.dataset.goto);
    });
  });
}

function updateInvBadge() {
  const count = ['plane','police','tatami','diaryone','rice','dad','ricesugar','light',
    'diarytwo','diarythree','rbuilding','mbuilding','fbuilding','cbuilding','paper','uniform']
    .reduce((n,k) => n + (state[k] ? 1 : 0), 0);
  const badge = document.getElementById('inv-badge');
  if (count > 0) {
    badge.style.display = 'block';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
}

/* 關鍵線索找齊提示 */
let keyClueChecked = false;
function queueKeyClueCheck() {
  if (state.dad && state.paper && !keyClueChecked) {
    keyClueChecked = true;
    setTimeout(() => {
      showModal('線索已找齊', `
        <p>關鍵線索已找齊！</p>
        <div class="choices" style="margin-top:14px;">
          <a class="choice-link" data-goto="答題環節">進入思緒</a>
        </div>
      `);
    }, 800);
  }
}

/* 提示 toast */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2000);
}

/* 頂列按鈕 */
document.getElementById('btn-restart').onclick = () => {
  if (confirm('確定要重新開始嗎？目前進度將會清除。')) location.reload();
};
document.getElementById('btn-credits').onclick = () => {
  showModal('製作人員', `
    <p style="line-height:2.2; font-size:16px;">
      <strong>三知餘文化</strong><br>
      實習生 陳宥諼／陳雨柔（劇本／網頁設計）<br>
      2026年重製版
    </p>
  `);
};

/* 啟動 */
goto('start');
</script>
